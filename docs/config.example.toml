# herddash configuration example.
#
# herddash reads one TOML file at start and never reloads it; restart to apply a
# change. The default location is ~/.config/herddash/config.toml, and running
# without that file is fine. Every key below has a default except session,
# socket_path and server, which are optional (the socket and Server are then
# derived as described below), and the Profile Map, which is empty unless
# configured. A path given with --config must exist.
#
# Command-line flags beat this file, and this file beats the defaults. Unknown
# keys and invalid values are errors that name the key, and herddash exits
# before doing anything else. `herddash config` prints the effective
# configuration as JSON.
#
# Paths may start with ~/ for the home directory. Otherwise they must be
# absolute, because herddash runs under launchd or systemd.

# This Host's name, used in every Agent's identity and in API paths.
# Default: the OS hostname, up to its first dot.        Flag: --host
# host = "workstation"

# --- Which herdr server to observe ------------------------------------------
#
# The socket is found in this order, as herdr itself does:
#   1. socket_path (or --socket)
#   2. session (or --session): ~/.config/herdr/sessions/<name>/herdr.sock
#   3. the HERDR_SOCKET_PATH environment variable
#   4. the HERDR_SESSION environment variable, as for session
#   5. ~/.config/herdr/herdr.sock
#
# The first that is set wins, so socket_path beats session even when session
# comes from a flag. A service unit should set neither environment variable.

# A named herdr session.                                Flag: --session
# session = "work"

# An explicit socket path.                              Flag: --socket
# socket_path = "~/.config/herdr/sessions/work/herdr.sock"

# This herdr server's name, part of every Agent's identity. It is derived from
# the socket: "default" for ~/.config/herdr/herdr.sock and <name> for
# ~/.config/herdr/sessions/<name>/herdr.sock. Any other socket path needs it
# set. When set, it always wins.                        Flag: --server
# server = "default"

# --- Serving -----------------------------------------------------------------

# Address for the Board and the API, read-only apart from the acknowledgement
# ("Seen") routes the Board's own page uses (ADR-0014). Only loopback addresses
# (127.0.0.0/8, ::1, localhost) are accepted, because authentication does not
# exist yet.                                            Flag: --bind
# bind = "127.0.0.1:7318"

# --- Storage -----------------------------------------------------------------

# Data directory, created owner-only (0700).
# Default: $XDG_DATA_HOME/herddash, else ~/.local/share/herddash.
#                                                       Flag: --data-dir
# data_dir = "~/.local/share/herddash"

# Database file. Default: <data_dir>/herddash.db.       Flag: --database
# database = "~/.local/share/herddash/herddash.db"

# Days of history kept. Must be at least 1. Default: 90.
#                                                       Flag: --retention-days
# retention_days = 90

# --- herdr version gate ------------------------------------------------------

# herdr older than the supported minimum is refused: nothing is recorded. Set
# this to record anyway, with a warning, while dogfooding against an older
# herdr. Default: false.                                Flag: --allow-unsupported-herdr
# allow_unsupported_herdr = false

# --- Claude Code recaps (ADR-0010) -------------------------------------------

# Show Claude Code's own session recap on the Board. When true, herddash reads
# the two-sentence recap Claude Code writes into the session transcript about
# three minutes after a turn ends ("... Next I'll ...") and shows it in the
# Box in place of the Context Line, until the Agent's next turn starts. The
# recap is model-written text about your work: it is kept in memory only,
# never stored or logged, and is served on loopback like the rest of the
# Board. Turning this on is your consent. File only, no flag. Default: false.
# claude_recaps = false

# --- Profile Map -------------------------------------------------------------
#
# One table per Agent Program, as herdr names it, saying how to tell which
# Profile (account) an Agent runs under. The only rule type is "env": read one
# environment variable from the Agent's process.
#
#   rule      "env"
#   variable  the environment variable to read
#   absent    the Profile when the variable is unset
#   values    variable value -> Profile name; a leading ~/ is expanded
#
# A variable that is set but matches no value resolves to "unresolved". An
# Agent Program with no table here is shown by its program name.

# Claude Code: the account is chosen by CLAUDE_CONFIG_DIR. Unset means the
# default ~/.claude account.
[profiles.claude]
rule = "env"
variable = "CLAUDE_CONFIG_DIR"
absent = "claude"

[profiles.claude.values]
# Uncomment and adapt, one line per wrapper that sets CLAUDE_CONFIG_DIR:
# "~/.claude-cldp" = "cldp"
# "~/.claude-cldw" = "cldw"

# --- Fixed timings (not configurable) ----------------------------------------
#
# These are not keys: herddash has no setting for them. They are listed here so
# you know what to expect. They are named constants in
# internal/engine/tunables.go, cmd/herddash/serve.go, internal/httpapi/events.go
# and the Board's internal/httpapi/web/order.mjs, each of which points back
# here; a change there must change this list too.
#
# Talking to herdr
#   ping timeout, at each start (reads herdr's version)       10 s
#   subscription setup timeout                                 10 s
#   one snapshot read, timeout                                 30 s
#   least time between the starts of two snapshot reads         1 s
#   reconcile: a snapshot read while connected, every          60 s
#   least time between the starts of two resyncs                5 s
#     (also how often a pane herdr keeps rejecting is subscribed again)
#   wait before reading again after a failed snapshot read      2 s
#   failed snapshot reads in a row, once started, before
#     herdr counts as lost and herddash reconnects              3
#   reconnect backoff: first wait 1 s, doubling per failure, at most 30 s,
#     forever; a connection up for 30 s resets it
#   ping of a herdr the version gate refused, every            30 s
#
# Agents
#   resolving one Agent's Profile, timeout                      2 s
#     (one lookup per pane at a time; a lookup that runs out or whose
#     herdr call fails is retried, and until one succeeds a new Agent is
#     recorded as "unresolved" and a known Agent keeps the Profile it had
#     for the same program)
#   retries of a Profile lookup that failed that way            3
#     (first after 2 s, doubling per retry; a rule outcome or an
#     unreadable environment is never retried)
#   longest hold of a known Agent's rows while its Profile is
#     resolved again (program change, redetection, reconnect)   4 s
#     (2 x the Profile timeout from the hold's start; then the rows are
#     recorded with the best Profile known)
#   first look for background work after done or idle        250 ms
#   background work re-read while done or idle, every           5 s
#   one read of an Agent process's children, timeout            2 s
#   Claude Code session record read, every                      2 s
#   one session record read, timeout                            1 s
#
# Record
#   Retention sweep, every (from the first ready connection)    1 h
#
# HTTP and the Board
#   a client's request headers, timeout                        10 s
#   one write to the event stream or a history reply, timeout  10 s
#   event stream keepalive, every                              15 s
#   the Board treats a stream silent for this long as lost     35 s
#   the Board's reopen after the stream closed: first wait 1 s, doubling,
#     at most 30 s; a fresh state resets it
#   graceful HTTP shutdown when herddash stops, at most         5 s
