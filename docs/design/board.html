<style>
/* ---- Tokens: light (default) ---- */
:root {
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem;    --space-5: 1.5rem; --space-6: 2rem;

  --text-label: 0.8125rem;   /* class label, workspace header */
  --text-meta: 0.875rem;     /* directory, workspace and tab */
  --text-body: 1rem;         /* Context Line, quiet Waiting Time */
  --text-heading: 1.0625rem; /* profile · program */
  --text-time: 1.25rem;      /* Finished Waiting Time */
  --text-time-loud: 2rem;    /* Needs you Waiting Time */
  --text-time-loud-narrow: 1.5rem; /* the same, in a Box narrower than 18.5rem */

  --box-min: 17rem;   /* narrowest column before the grid drops one */
  --box-h: 10.5rem;   /* every Box, whatever its content: 5 rows + gaps + padding */
  --radius: 0.5rem;

  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --ink: #16191F;
  --ink-muted: #4B5361;
  --ink-faint: #646C79;
  --border: #D3D7DE;
  --border-quiet: #C4C9D1;

  --needs-bg: #B42318;
  --needs-ink: #FFFFFF;
  --needs-ink-2: #FFE1DC;
  --needs-ring: #7A140D;

  --finished-accent: #17663F;
  --finished-edge: #1F8A55;

  --focus: #1D4ED8;

  --strip-disc-bg: #3A4150;  --strip-disc-ink: #FFFFFF;
  --strip-adv-bg: #FDE9A8;   --strip-adv-ink: #4D3600;
  --strip-ref-bg: #8F1D15;   --strip-ref-ink: #FFFFFF;

  --stale-opacity: 0.5;
}

/* ---- Tokens: dark ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1014; --surface: #1A1E25; --ink: #E9EBEF; --ink-muted: #A7AEBA; --ink-faint: #8B93A0;
    --border: #2D323C; --border-quiet: #3A404B;
    --needs-bg: #FF7A59; --needs-ink: #1A0703; --needs-ink-2: #3D1307; --needs-ring: #FFB199;
    --finished-accent: #5BD69A; --finished-edge: #3FB37B;
    --focus: #7AA2FF;
    --strip-disc-bg: #323946; --strip-disc-ink: #E9EBEF;
    --strip-adv-bg: #3D2E05;  --strip-adv-ink: #FFE7A3;
    --strip-ref-bg: #A3261C;  --strip-ref-ink: #FFFFFF;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1014; --surface: #1A1E25; --ink: #E9EBEF; --ink-muted: #A7AEBA; --ink-faint: #8B93A0;
  --border: #2D323C; --border-quiet: #3A404B;
  --needs-bg: #FF7A59; --needs-ink: #1A0703; --needs-ink-2: #3D1307; --needs-ring: #FFB199;
  --finished-accent: #5BD69A; --finished-edge: #3FB37B;
  --focus: #7AA2FF;
  --strip-disc-bg: #323946; --strip-disc-ink: #E9EBEF;
  --strip-adv-bg: #3D2E05;  --strip-adv-ink: #FFE7A3;
  --strip-ref-bg: #A3261C;  --strip-ref-ink: #FFFFFF;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* ---- Page ---- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: 1.5;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* ---- Strips: thin, full width, only when needed ---- */
.strips { position: sticky; top: 0; z-index: 2; }
.strip {
  margin: 0;
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-meta);
  font-weight: 600;
  line-height: 1.4;
}
.strip--disconnected { background: var(--strip-disc-bg); color: var(--strip-disc-ink); }
.strip--advisory     { background: var(--strip-adv-bg);  color: var(--strip-adv-ink); }
.strip--refused      { background: var(--strip-ref-bg);  color: var(--strip-ref-ink); }
.strip .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- Board: two zones ---- */
.board { padding: var(--space-4); }
.zone + .zone { margin-top: var(--space-6); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--box-min)), 1fr));
  gap: var(--space-3);
}
/* Lower zone: one thin workspace header per group. The first one also draws the zone line. */
.group + .group { margin-top: var(--space-5); }
.ws-header {
  margin: 0 0 var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--border);
  color: var(--ink-muted);
  font-size: var(--text-label);
  font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Empty top zone: the first workspace header draws no separator rule. */
.board > .zone:first-child > .group:first-of-type > .ws-header { border-top: 0; padding-top: 0; }

/* ---- Box: fixed height, five fixed rows ---- */
.box {
  container-type: inline-size;
  height: var(--box-h);
  overflow: hidden;
  display: grid;
  grid-template-rows: 2.25rem 1.5rem 1.5rem 1.25rem 1.25rem;
  row-gap: var(--space-1);
  align-content: start;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink-muted);
}
.box > * { min-width: 0; margin: 0; }
.line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); align-self: center; min-width: 0; }
.status-row .class { flex: 0 0 auto; }
.class {
  font-size: var(--text-label);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.wait {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--text-body);
  line-height: 1;
  white-space: nowrap;
}
.heading { font-size: var(--text-heading); font-weight: 600; line-height: 1.5rem; color: var(--ink); }
.context { font-size: var(--text-body); line-height: 1.5rem; }
.dir, .where { font-size: var(--text-meta); line-height: 1.25rem; }
/* Directory truncates from the start, so the last segment (the project) stays visible. */
.dir { font-family: var(--font-mono); direction: rtl; text-align: left; }
.dir > bdi { direction: ltr; unicode-bidi: isolate; }

/* Needs you: dominant. Filled, heavy ring, uppercase label, largest type. Never colour alone. */
.box--needs_you {
  background: var(--needs-bg);
  color: var(--needs-ink-2);
  border: 3px solid var(--needs-ring);
  padding: calc(var(--space-3) - 2px) calc(var(--space-4) - 2px);
}
.box--needs_you .class { color: var(--needs-ink); font-size: var(--text-meta); }
.box--needs_you .wait { color: var(--needs-ink); font-size: var(--text-time-loud); font-weight: 800; }
/* A narrow column steps the loud time down so "≥ 23h 59m" still fits; ellipsis is the last resort. */
@container (max-width: 18.5rem) { .box--needs_you .wait { font-size: var(--text-time-loud-narrow); } }
.box--needs_you .heading,
.box--needs_you .context { color: var(--needs-ink); }
.box--needs_you .context { font-weight: 600; }

/* Finished: quieter. Raised surface, coloured leading edge, labelled. */
.box--finished {
  background: var(--surface);
  color: var(--ink-muted);
  border-left: 6px solid var(--finished-edge);
  padding-left: calc(var(--space-4) - 5px);
}
.box--finished .class { color: var(--finished-accent); }
.box--finished .wait { color: var(--ink); font-size: var(--text-time); font-weight: 600; }
.box--finished .context { color: var(--ink); }

/* Working and Unknown: recede. Flush with the page, muted text, regular weight. */
.box--working .class,
.box--unknown .class { color: var(--ink-muted); font-weight: 600; }
.box--working .heading,
.box--unknown .heading { color: var(--ink-muted); font-weight: 500; }
.box--unknown { border-style: dashed; border-color: var(--border-quiet); }
/* An idle Agent never seen working: no Waiting Time emphasis at all. */
.box--never-working .wait { color: var(--ink-faint); font-size: var(--text-meta); }
.wait--none { color: var(--ink-faint); }

/* Disconnected: every Box dimmed, never hidden. */
.board[data-stale] .box { opacity: var(--stale-opacity); filter: saturate(0.35); }

@media (prefers-reduced-motion: no-preference) {
  .box { transition: opacity 200ms ease, filter 200ms ease; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---- Design-review toolbar: NOT part of the Board ---- */
.review {
  position: sticky; bottom: 0; z-index: 3;
  margin: var(--space-6) var(--space-4) 0;
  padding: var(--space-2) var(--space-3);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-5);
  background: repeating-linear-gradient(135deg, var(--surface) 0 10px, var(--bg) 10px 20px);
  border: 2px dashed var(--ink-faint);
  border-bottom: 0;
  border-radius: var(--radius) var(--radius) 0 0;
  font-size: var(--text-meta);
  color: var(--ink);
}
.review strong { font-size: var(--text-label); text-transform: uppercase; letter-spacing: 0.06em; }
.review fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); }
.review legend { float: left; margin-right: var(--space-2); font-weight: 600; }
.review label { display: inline-flex; align-items: center; gap: var(--space-1); cursor: pointer; }
</style>
</head>

<script>
"use strict";
(function () {
  var fixture = JSON.parse(document.getElementById("fixture").textContent);
  var loadedAt = Date.now();

  // The fixture's clock, advanced from page load so Waiting Times tick.
  function nowMs() { return fixture.now_ms + (Date.now() - loadedAt); }

  // ---- Pure helpers (the part Story 3.7 would move into its ES module) ----

  function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

  // Exactly the Daemon's order (internal/core/view.go SortKey.compare): zone,
  // group, class_rank, start, then the AgentKey as host, server, epoch
  // (numerically) and pane id. sort_key[4] is not compared as one string,
  // because "10" sorts before "9" as text.
  function compareAgents(a, b) {
    for (var i = 0; i < 4; i++) {
      var c = cmp(a.sort_key[i], b.sort_key[i]);
      if (c) return c;
    }
    return cmp(a.key.host, b.key.host) || cmp(a.key.server, b.key.server) ||
           cmp(a.key.epoch, b.key.epoch) || cmp(a.key.pane_id, b.key.pane_id);
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  // 0s..59s, 1m..59m, 1h 00m..23h 59m, 1d 00h onwards. The second unit is
  // always two digits, so width only steps at a unit boundary.
  function formatDuration(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h " + pad2(m % 60) + "m";
    return Math.floor(h / 24) + "d " + pad2(h % 24) + "h";
  }

  // Strip duration keeps seconds: it is read when something is wrong.
  function formatSince(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m " + pad2(s % 60) + "s";
    return formatDuration(ms);
  }

  function waitingText(agent, now) {
    if (agent.waiting_since == null) return null;
    var d = formatDuration(now - agent.waiting_since);
    return agent.waiting_exact ? d : "≥ " + d;
  }

  // "workspace › tab", leaving out an empty one and its separator.
  function whereText(agent) {
    return [agent.workspace, agent.tab].filter(Boolean).join(" › ");
  }

  // The Box's accessible name: everything it shows, untruncated, so keyboard
  // and screen-reader users can read a Box in full.
  function boxLabel(agent, now) {
    var w = waitingText(agent, now);
    return [
      CLASS_LABEL[agent.attention_class] || agent.attention_class,
      w ? "waiting " + w.replace("≥ ", "at least ") : "Waiting Time unknown",
      agent.heading,
      agent.context_line,
      agent.directory,
      whereText(agent)
    ].filter(Boolean).join(", ");
  }

  function clockUTC(ms) {
    var d = new Date(ms);
    return pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes()) + ":" + pad2(d.getUTCSeconds()) + " UTC";
  }

  var CLASS_LABEL = { needs_you: "Needs you", finished: "Finished", working: "Working", unknown: "Unknown" };

  // ---- Strip scenarios for review: each replaces the fixture's ConnectionTruth ----

  function connectionFor(scenario) {
    var c = Object.assign({}, fixture.connection);
    if (scenario === "disconnected" || scenario === "disconnected+advisory") {
      c.connected = false;
      c.last_snapshot_at = fixture.now_ms - 160000;
    }
    if (scenario === "advisory" || scenario === "disconnected+advisory") {
      c.herdr_version = "0.8.2"; c.gate = "advisory"; c.resync_guaranteed = false;
    } else if (scenario === "refused") {
      c.herdr_version = "0.8.2"; c.gate = "refused"; c.resync_guaranteed = false;
    }
    return c;
  }

  // ---- DOM ----

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var timeNodes = [];   // [{node, agent, box}]
  var stripTime = null; // {node, at}

  function renderBox(agent, now) {
    var cls = agent.attention_class;
    var box = el("article", "box box--" + cls);
    if (agent.status === "idle" && cls === "working") box.classList.add("box--never-working");
    box.tabIndex = 0;
    box.setAttribute("aria-label", boxLabel(agent, now));

    var row = el("p", "status-row");
    row.appendChild(el("span", "class", CLASS_LABEL[cls] || cls));
    var w = waitingText(agent, now);
    var wait = el("span", "wait" + (w ? "" : " wait--none"), w || "—");
    if (!w) {
      wait.title = "Waiting Time unknown";
      wait.setAttribute("aria-label", "Waiting Time unknown");
    } else {
      timeNodes.push({ node: wait, agent: agent, box: box });
    }
    row.appendChild(wait);
    box.appendChild(row);

    box.appendChild(el("p", "heading line", agent.heading));

    // Always present, so an empty Context Line keeps its row and the Box its height.
    var ctx = el("p", "context line", agent.context_line);
    if (agent.context_line) ctx.title = agent.context_line;
    else ctx.setAttribute("aria-hidden", "true");
    box.appendChild(ctx);

    // Rows stay even when empty, so the Box keeps its height; empty ones get no title.
    var dir = el("p", "dir line");
    if (agent.directory) {
      dir.appendChild(el("bdi", null, agent.directory));
      dir.title = agent.directory;
    }
    box.appendChild(dir);

    var where = whereText(agent);
    var wh = el("p", "where line", where);
    if (where) wh.title = where;
    box.appendChild(wh);
    return box;
  }

  function renderStrips(c, now) {
    var host = document.getElementById("strips");
    host.textContent = "";
    stripTime = null;
    if (!c.connected) {
      var s = el("p", "strip strip--disconnected");
      if (c.last_snapshot_at) {
        // The ticking age is hidden from the live region; screen readers get the fixed time instead.
        s.appendChild(document.createTextNode("Disconnected from herdr. Last snapshot "));
        var t = el("span", "time", formatSince(now - c.last_snapshot_at) + " ago");
        t.setAttribute("aria-hidden", "true");
        s.appendChild(t);
        s.appendChild(el("span", "sr-only", "at " + clockUTC(c.last_snapshot_at)));
        s.appendChild(document.createTextNode("; Boxes show that snapshot."));
        stripTime = { node: t, at: c.last_snapshot_at };
      } else {
        s.appendChild(document.createTextNode("Disconnected from herdr. No snapshot received yet."));
      }
      host.appendChild(s);
    }
    if (c.gate === "advisory") {
      var a = "herdr " + c.herdr_version + " is below the supported minimum " + c.herdr_minimum +
              "; recording under the dogfooding flag.";
      if (!c.resync_guaranteed) a += " Below 0.9.0 resync is not guaranteed: herdr can replay stale events and cannot signal lost ones.";
      host.appendChild(el("p", "strip strip--advisory", a));
    } else if (c.gate === "refused") {
      host.appendChild(el("p", "strip strip--refused",
        "herdr " + c.herdr_version + " is not supported. herddash needs " + c.herdr_minimum +
        " or newer and is recording nothing."));
    }
  }

  function render(scenario) {
    var now = nowMs();
    var c = connectionFor(scenario);
    timeNodes = [];
    renderStrips(c, now);

    var board = document.getElementById("board");
    board.textContent = "";
    if (c.connected) board.removeAttribute("data-stale"); else board.setAttribute("data-stale", "");
    if (c.gate === "refused") return; // refused: no Boxes at all

    var agents = fixture.agents.slice().sort(compareAgents);
    var headers = fixture.headers || [];
    var firstLower = headers.length ? headers[0] : agents.length;

    if (firstLower > 0) {
      var top = el("section", "zone");
      top.setAttribute("aria-label", "Needs you and Finished");
      top.appendChild(el("h2", "sr-only", "Needs you and Finished"));
      var grid = el("div", "grid");
      for (var i = 0; i < firstLower; i++) grid.appendChild(renderBox(agents[i], now));
      top.appendChild(grid);
      board.appendChild(top);
    }

    if (headers.length) {
      var lower = el("section", "zone");
      lower.setAttribute("aria-label", "Working and Unknown, by workspace");
      lower.appendChild(el("h2", "sr-only", "Working and Unknown"));
      for (var h = 0; h < headers.length; h++) {
        var start = headers[h], end = h + 1 < headers.length ? headers[h + 1] : agents.length;
        var group = el("div", "group");
        var label = agents[start].workspace || "(no workspace)";
        var hd = el("h3", "ws-header", label);
        hd.title = label;
        group.appendChild(hd);
        var g = el("div", "grid");
        for (var j = start; j < end; j++) g.appendChild(renderBox(agents[j], now));
        group.appendChild(g);
        lower.appendChild(group);
      }
      board.appendChild(lower);
    }
  }

  function tick() {
    var now = nowMs();
    for (var i = 0; i < timeNodes.length; i++) {
      timeNodes[i].node.textContent = waitingText(timeNodes[i].agent, now);
      timeNodes[i].box.setAttribute("aria-label", boxLabel(timeNodes[i].agent, now));
    }
    if (stripTime) stripTime.node.textContent = formatSince(now - stripTime.at) + " ago";
  }

  var review = document.getElementById("review");
  review.addEventListener("change", function (e) {
    if (e.target.name === "theme") {
      if (e.target.value === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", e.target.value);
    } else if (e.target.name === "strip") {
      render(e.target.value);
    }
  });
  review.addEventListener("submit", function (e) { e.preventDefault(); });

  render("none");
  setInterval(tick, 1000);
})();
</script>
