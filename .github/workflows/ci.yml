name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs running on:"
            echo "$unformatted"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      # The Board's ordering module, against core's golden fixture. Node is
      # preinstalled on the runner; no npm packages. The test files are named
      # by a shell glob because Node 22 does not take a directory argument.
      # The step fails on a Node older than 18 and when no test ran.
      - name: board tests
        run: |
          set -o pipefail
          node --version
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 18 ]; then
            echo "node $major is older than 18"
            exit 1
          fi
          tap="$RUNNER_TEMP/board-tests.tap"
          node --test --test-reporter=tap internal/httpapi/web/*.test.mjs | tee "$tap"
          tests="$(sed -n 's/^# tests //p' "$tap")"
          if [ "${tests:-0}" -eq 0 ]; then
            echo "no board tests ran"
            exit 1
          fi

  cross-compile:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build and vet ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build -o /dev/null ./cmd/herddash
          go vet ./...
